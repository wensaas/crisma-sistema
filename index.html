<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda Crisma — Sistema de Gestión</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="css/app.css?v=15" />
</head>
<body>

<!-- LOADING -->
<div id="loading-screen">
  <div class="spinner"></div>
  <p>Cargando sistema…</p>
</div>

<!-- LOGIN -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="login-brand">
      <div class="logo-ring">C</div>
      <h1>Tienda <span>Crisma</span></h1>
      <p>Sistema de Gestión Integral</p>
    </div>
    <form id="login-form">
      <div class="form-group">
        <label for="inp-email">Correo electrónico</label>
        <input type="email" id="inp-email" placeholder="correo@ejemplo.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="inp-password">Contraseña</label>
        <input type="password" id="inp-password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <div id="login-error" class="error-msg hidden"></div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-btn">Ingresar</button>
    </form>
    <div class="login-footer">
      <p>Powered by <strong>WenSAAS</strong></p>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

  <!-- SIDEBAR OVERLAY (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">C</div>
      <div>
        <h2>Crisma</h2>
        <p>Gestión Integral</p>
      </div>
    </div>
    <div class="sidebar-user" id="sidebar-user">
      <!-- JS filled -->
    </div>
    <nav class="sidebar-nav" id="sidebar-nav">
      <!-- JS filled -->
    </nav>
    <button class="sidebar-logout" id="logout-btn">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
      Cerrar sesión
    </button>
  </aside>

  <!-- MAIN -->
  <div class="main-content">
    <!-- MOBILE HEADER -->
    <header class="mobile-header">
      <button id="sidebar-toggle">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1>Tienda Crisma</h1>
      <span></span>
    </header>
    <!-- VIEW CONTAINER -->
    <div id="view-container"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- CONFIRM DIALOG -->
<div class="modal-overlay hidden" id="confirm-overlay">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h3>Confirmar acción</h3>
      <button class="modal-close" id="confirm-close">&times;</button>
    </div>
    <div class="modal-body">
      <p id="confirm-msg" style="margin-bottom:20px; font-size:14px; color:var(--text-muted)"></p>
      <div class="form-actions">
        <button class="btn btn-secondary" id="confirm-cancel">Cancelar</button>
        <button class="btn btn-danger" id="confirm-ok">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toast-container"></div>

<!-- Error diagnostics -->
<script>
window.onerror = function(msg, src, line, col, err) {
  var el = document.getElementById('loading-screen');
  if (el) el.innerHTML = '<div style="color:white;padding:20px;text-align:center;max-width:90%"><p style="font-size:16px;font-weight:bold;margin-bottom:12px">⚠ Error detectado</p><p style="font-size:13px;background:rgba(255,255,255,.15);padding:12px;border-radius:8px;word-break:break-all;text-align:left">' + msg + '<br><small style="opacity:.7">' + src + ':' + line + '</small></p><br><button onclick="location.reload()" style="background:#38d9a9;border:none;color:#0f2942;padding:10px 22px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600">Recargar</button></div>';
};
window.addEventListener('unhandledrejection', function(e) {
  var el = document.getElementById('loading-screen');
  if (el && !el.querySelector('[data-err]')) el.innerHTML = '<div style="color:white;padding:20px;text-align:center;max-width:90%"><p style="font-size:16px;font-weight:bold;margin-bottom:12px">⚠ Error de promesa</p><p data-err style="font-size:13px;background:rgba(255,255,255,.15);padding:12px;border-radius:8px;word-break:break-all;text-align:left">' + ((e.reason && e.reason.message) ? e.reason.message : String(e.reason)) + '</p><br><button onclick="location.reload()" style="background:#38d9a9;border:none;color:#0f2942;padding:10px 22px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600">Recargar</button></div>';
});
setTimeout(function() {
  var el = document.getElementById('loading-screen');
  if (el && !el.classList.contains('hidden')) {
    el.innerHTML += '<div style="margin-top:20px"><p style="color:rgba(255,255,255,.6);font-size:12px">Tiempo de espera agotado — verifica tu conexión a Internet.</p><br><button onclick="location.reload()" style="background:#1e6bb8;border:none;color:white;padding:10px 22px;border-radius:6px;cursor:pointer;font-size:14px">Reintentar</button></div>';
  }
}, 8000);
</script>

<!-- Firebase SDK (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- App -->
<script src="js/config.js?v=15"></script>
<script src="js/app.js?v=15"></script>
</body>
</html>
